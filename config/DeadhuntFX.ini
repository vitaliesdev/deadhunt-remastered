; DeadhuntFX - posprocesado nativo
; F9  = activar/desactivar todos los efectos (para comparar)
; F10 = recargar este archivo y los shaders sin cerrar el juego
; Enabled=1 activa un efecto, Enabled=0 lo desactiva.

[General]
; Idioma del juego: es, en, ru, fr, de, it, pt, pl, uk (se aplica al reiniciar)
Language=es
Enabled=1
; Codigos de tecla virtual de Windows: 120 = F9, 121 = F10
ToggleKey=120
ReloadKey=121
; Modo ventana del tamano del monitor: ventana sin bordes que lo cubre entero (1) o ventana normal (0)
Borderless=1

[FXAA]
; Suavizado de bordes en posprocesado. Con MSAA 4x ya activo no suele hacer falta.
Enabled=1
; Contraste minimo para considerar un borde (mas bajo = suaviza mas, mas borroso)
Threshold=0.08

[Sharpen]
; Nitidez adaptativa (0.0 - 1.0)
Enabled=1
Strength=0.6

[Bloom]
; Resplandor en zonas brillantes (cielo, fuego, explosiones)
Enabled=1
; A partir de que brillo empieza a brillar (0.0 - 1.0, mas bajo = mas zonas brillan)
Threshold=0.65
; Fuerza del resplandor
Intensity=0.35
; Tamano del halo (1.0 = normal)
Radius=1.0

[Color]
Enabled=1
; 1.0 = sin cambios en todos los valores
Exposure=1.03
Gamma=1.0
Contrast=1.03
Saturation=1.0
; Viveza: satura sobre todo los colores apagados (0 = sin cambios)
Vibrance=0.05
; Temperatura: positivo = mas calido, negativo = mas frio
Temperature=0.0

[Vignette]
; Oscurece suavemente los bordes de la pantalla
Enabled=1
Strength=0.35
; Donde empieza a oscurecer (0 = centro, 1 = esquinas)
Radius=0.55

[Grain]
; Grano de pelicula
Enabled=1
Strength=0.03

[Debug]
; Perfilador: registra en DeadhuntFX.log los fotogramas lentos.
Profile=0
; 1 = muestra solo la oclusion ambiental en blanco y negro (para comprobarla y ajustarla)
ShowAO=0
; Vista de depuracion: 0 = normal, 1 = oclusion, 2 = orientacion de superficies, 3 = profundidad
View=0

[Buffers]
; Evita que la CPU espere a la grafica al actualizar buffers.
; 1 = activado, 0 = comportamiento original.
Fix=1

[SMAA]
; Suavizado SMAA (oficial, iryoku/smaa). Suaviza hierba, hojas y vallas, que el MSAA no.
Enabled=1

[AO]
; Oclusion ambiental: sombras suaves donde los objetos se tocan o se juntan.
Enabled=1
; Radio en unidades del juego (aprox. cm). Mas grande = sombras mas amplias.
Radius=120
; Fuerza (0.5 = sutil, 1.0 = normal, 2.0 = muy marcada)
Intensity=1
; Sesgo: sube si aparecen manchas en superficies planas
Bias=0.15
; Distancia a la que empieza a desvanecerse y desaparece (evita parpadeo lejano)
FadeStart=2000
FadeEnd=6000

[Fog]
; Niebla atmosferica por distancia, mas densa en zonas bajas. Usa el color de niebla del mapa.
Enabled=1
; Densidad (mas alto = niebla mas espesa)
Density=0.003
; Distancia a la que empieza (unidades del juego)
Start=2500
; Opacidad maxima (0.0 - 1.0)
MaxOpacity=0.55
; Cuanto se aclara la niebla con la altura (0 = igual a cualquier altura)
HeightFalloff=0.0004
; Altura del suelo de referencia
BaseHeight=0

[GodRays]
; Rayos de sol que se cuelan entre arboles y montanas (usa la luz del sol del mapa).
Enabled=1
; Fuerza de los rayos
Intensity=0.4
; Cuanto se alargan (0.5 - 1.0)
Length=0.5
; Cuanto se atenuan a lo largo del rayo (0.90 - 0.99, mas alto = rayos mas largos)
Decay=0.97
; Que parte del cielo cuenta como brillante (0.0 - 1.0, mas bajo = mas rayos)
Threshold=0.6

[DOF]
; Profundidad de campo: lo muy lejano ligeramente desenfocado. El arma y lo cercano quedan nitidos.
Enabled=1
; Distancia a la que empieza a desenfocarse y a la que llega al maximo
Start=8000
End=40000
; Fuerza maxima del desenfoque (0.0 - 1.0)
Strength=0.7

[WeaponLight]
; Iluminacion realista del arma: brillo del sol en el metal, contorno y sombras en sus huecos.
Enabled=1
; Fuerza del brillo del sol en el metal
Specular=0.6
; Tamano del brillo (mas alto = brillo mas pequeno y concentrado, tipo metal pulido)
Shininess=24
; Luz de contorno en los bordes del arma
Rim=0.25
; Sombras en los huecos del arma (0 = sin sombras, 1 = maximas)
SelfShadow=0.6
; --- Material de la mano (guante): casi sin brillo
HandsSpecular=0.08
HandsShininess=6
HandsRim=0.12
; Tamano de la textura de la mano (HAND/HANDBASE = 256x256; 0 = no separar mano y arma)
HandsTextureWidth=256
HandsTextureHeight=256

[MuzzleFlash]
; El fogonazo del disparo ilumina el entorno y el arma.
Enabled=1
; Fuerza de la luz sobre paredes, suelo y enemigos
Strength=1.5
; Alcance de la luz (unidades del juego, aprox. cm)
Radius=700
; Fuerza de la luz sobre el propio arma
WeaponStrength=0.8
; Sensibilidad de deteccion del fogonazo (sube si no se nota, baja si se enciende sin disparar)
Sensitivity=40
; Color de la luz (anaranjado)
ColorR=1.0
ColorG=0.72
ColorB=0.42

[Shadows]
; Sombras del sol con mapa de sombras: la escena se dibuja tambien desde el sol, asi que
; los objetos proyectan sombra aunque no esten en pantalla.
Enabled=1
; Oscuridad de la sombra (0.0 - 1.0)
Strength=0.5
; Radio del area con sombras alrededor del jugador (unidades del juego, aprox. cm).
; Mas grande = sombras mas lejos pero menos detalladas.
Range=3000
; Resolucion del mapa de sombras (1024, 2048, 4096). Mas alto = sombras mas nitidas.
MapSize=4096
; Suavidad del borde de la sombra (en pixeles del mapa)
Softness=1.5
; Distancia a la que las sombras empiezan a desvanecerse y desaparecen
FadeStart=3000
FadeEnd=9000
[HUD]
; HUD de partida nuevo (minimalista, a juego con los menus). 0 = HUD original del juego.
New=1
; Menus con el estilo nuevo (paneles de cristal ahumado, letra Barlow, acentos rojos). 0 = menus originales.
MenuSkin=1
; Interfaz y menus sin deformar en pantallas panoramicas (manteniendo el diseno original).
Enabled=1
; Tamano de la interfaz (1.0 = original, 0.8 = mas pequena, 1.2 = mas grande)
Scale=1
; Ancho de la zona del HUD: 0 = toda la pantalla (vida y radar pegados a los bordes),
; 1.778 = zona 16:9 centrada (mas comodo en ultrawide, no hay que mirar a las esquinas)
Area=0
; Fondos a pantalla completa (menu principal): 1 = cubren la pantalla sin deformarse, 0 = estirados
CoverBackgrounds=1
; Recolocar tambien los menus (experimental: el raton puede no llegar a los bordes)
Menus=0
; Tamano del texto respecto al original corregido (1.0 = como en 4:3, 1.2 = algo mayor)
TextScale=1.0

[Display]
; Frecuencia en pantalla completa (Hz). 0 = la maxima del monitor. Se cambia desde AVANZADO.
RefreshRate=0

[Advanced]
; Pestana AVANZADO en Opciones (FOV, pantalla y efectos desde el juego). 0 = sin pestana.
Enabled=1

[Terrain]
; suelo: relieve (parallax), sin repeticion, mezcla por altura. Hierba: sombra en la base, variacion de color, contraluz
Enabled=1
Parallax=9
Relief=0.6
AntiTile=1
HeightBlend=1
FadeDistance=2500
Grass=1
GrassAO=0.6
GrassVariation=0.6
GrassBacklight=0.5
Objects=1
ObjectRelief=0.8

[Gamepad]
; Mando XInput (Xbox; otros mandos via Steam Input). Stick izq. mover, stick der. mirar, RT disparar, LT granada,
; A saltar, B agacharse, X recargar, Y recoger, LB/RB cambiar arma, START menu
Enabled=1
LookSpeed=1.0
InvertY=0
Deadzone=0.24
Vibration=1
